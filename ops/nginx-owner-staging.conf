# M2.9 Phase 3C - SAMPLE ONLY. Not provisioned on any VM.
# Enable this only on a dedicated, VPN-restricted, owner-controlled Ubuntu
# VM with trusted TLS. Replace example hostname and certificate paths.
# DO NOT point it at the existing yenuka2012.github.io origin.
server {
    listen 443 ssl;
    server_name exam.home.arpa;
    root /srv/examprep-owner-staging;
    index owner-staging.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/nginx/private/examprep-fullchain.pem;
    ssl_certificate_key /etc/nginx/private/examprep-privatekey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'; child-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # No SPA fallback on unknown routes; stale clients must fail closed.
    }

    location ~ ^/assets/[A-Za-z0-9._-]+\.(?:js|css|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/(?:ownerStagingSw\.js|owner-staging\.html|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ /\. {
        return 404;
    }

    # No server API/proxy, user-content routes, log upload endpoints or sync.
}
