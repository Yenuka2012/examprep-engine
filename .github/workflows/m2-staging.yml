name: M2 encrypted owner staging integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/vault/**'
      - 'src/data/**'
      - 'src/backup.ts'
      - 'src/catalogValidation.ts'
      - 'encrypted-owner.html'
      - 'owner-staging.html'
      - 'offline-converter.html'
      - 'runtime-harness.html'
      - 'vite.owner-staging.config.ts'
      - 'vite.vault.config.ts'
      - 'playwright.owner-pwa.config.ts'
      - 'e2e-owner-pwa/**'
      - 'scripts/verify-owner-pwa-build.mjs'
      - 'scripts/verify-vault-runtime-boundary.mjs'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'playwright.config.ts'
      - 'scripts/verify-hosting-builds.mjs'
      - '.github/workflows/m2-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m2-isolated-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Generate local schema validators
        run: npm run generate:validator
      - name: Build both Pages and Ubuntu static hosting targets
        run: |
          npm run build:pages
          npm run build:ubuntu
          npm run verify:hosting
      - name: Verify isolated vault runtime dependency graph
        run: npm run verify:vault-runtime
      - name: Compile separate HTTPS owner staging application (synthetic only)
        env:
          VITE_OWNER_STAGING_ORIGIN: https://exam.home.arpa
        run: npm run build:owner-staging
      - name: Check static-only owner PWA artifact and precache boundary
        run: npm run verify:owner-pwa
      - name: Browser regression for owner PWA shell (synthetic localhost)
        run: npm run test:e2e:owner-pwa
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-staging-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
