name: Secure CI and GitHub Pages deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: examprep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reproducible dependency installation
        run: npm ci --no-fund
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Unit and security tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Publish validated site build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site-dist
          path: dist
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
