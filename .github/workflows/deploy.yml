# M0.1: deployment is prohibited unless every check succeeds on the SAME commit.
name: Secure CI and GitHub Pages deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: examprep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reproducible dependency installation
        run: npm ci --no-fund
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Clean-checkout development validator bootstrap
        run: |
          test ! -e src/generated/validate-bank.js
          npm run predev
          test -s src/generated/validate-bank.js
          test -s src/generated/validate-bank.d.ts
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Unit and security tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assert approved production source and built Pages exclude experimental vault
        run: node scripts/verify-production-isolation.mjs
      - name: Verify encrypted runtime dependency graph excludes legacy source
        run: node scripts/verify-vault-runtime-boundary.mjs
      - name: Build HTTPS-only encrypted owner staging candidate (NEVER deployed)
        env:
          VITE_OWNER_STAGING_ORIGIN: https://exam.home.arpa
        run: |
          npm run build:owner-staging
          test -s dist-owner-staging/owner-staging.html
          test -s dist-owner-staging/ownerStagingSw.js
          test -s dist-owner-staging/manifest.webmanifest
          node scripts/verify-owner-pwa-build.mjs
          test ! -e dist-owner-staging/index.html
          test ! -e dist/owner-staging.html
          test ! -e dist/ownerStagingSw.js
          test -s dist/manifest.webmanifest # Original public PWA manifest must be preserved
          test ! -e dist/offline-converter.html
          test ! -e dist/encrypted-owner.html
      - name: Generate CycloneDX dependency inventory
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Hash production assets
        run: find dist -type f -exec sha256sum {} \; | LC_ALL=C sort > site-sha256.txt
      - name: Retain software inventory and build hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            sbom.cdx.json
            site-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish validated site build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # P0 #79: avoid slow Ubuntu apt mirrors during on-demand Playwright --with-deps.
    # Official Playwright v1.64.1 image includes browser binaries and OS libraries;
    # lock image digest to the exact reviewed Microsoft Artifact Registry build.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Verify version-matched preinstalled Playwright browsers
        run: |
          node --version
          node -p "require('@playwright/test/package.json').version"
          node -e "if (require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
          test -d /ms-playwright
      - name: Test production build in desktop and mobile browsers
        run: npm run test:e2e
      - name: Retain browser failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gate-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Source-wide writer freeze regression is an additional release gate.
  # It uses an ephemeral synthetic browser profile; no owner data is accessed.
  source-barrier-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install reproducibly
        run: npm ci --no-fund
      - name: Run Chromium, desktop WebKit, iPhone and iPad source-write freeze tests
        run: npm run test:e2e:barrier
      - name: Retain source-barrier failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: source-barrier-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14


  # Additional mandatory release gate: actual pre-barrier production bundle,
  # not a mocked old writer. Both builds run on ONE isolated localhost origin.
  mixed-version-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build candidate in separate test-only PWA path
        run: |
          npm ci --no-fund
          npm run build -- --mode mixed-cutover --outDir dist-mixed-candidate
      - name: Build exact historical v0.3.0 pre-Web-Lock SHA
        run: |
          OLD_SHA=bcea4dc48612641458c0de3a97b3e519470664c3
          git merge-base --is-ancestor "$OLD_SHA" HEAD
          mkdir -p .mixed-old/source
          git archive "$OLD_SHA" | tar -x -C .mixed-old/source
          test ! -e .mixed-old/source/src/legacyWriteBarrier.ts
          cd .mixed-old/source
          npm ci --no-fund
          npm run build
          cd ../..
          mv .mixed-old/source/dist .mixed-old/dist
          test -s .mixed-old/dist/index.html
          test -s dist-mixed-candidate/index.html
      - name: Real bundle mixed-version Chromium/WebKit/iPhone/iPad regression
        run: npm run test:e2e:mixed
      - name: Retain mixed-version failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mixed-version-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # M2.4 S1-S3 cryptographic bridge: isolated localhost-only harness.
  # Mandatory production gate; never package or publish dist-vault-test.
  vault-bridge-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reproducible dependency install
        run: npm ci --no-fund
      - name: Verify compiled vault harness isolation before browser tests
        run: |
          npm run build
          test ! -e dist/vault-harness.html
          if grep -R -l -E 'examprep-secure-vault-v1|SYNTHETIC-SECRET-QUESTION|SYNTHETIC-BACKUP-QUESTION' dist; then
            echo 'Experimental vault leaked into production build' >&2
            exit 1
          fi
          npm run build:vault-test
          test -s dist-vault-test/vault-harness.html
      - name: Run S1-S3 cryptographic owner, backup and no-fallback browser tests
        run: npm run test:e2e:vault
      - name: Preserve failing vault browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-bridge-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  codeql-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4 (2026-11-04)
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4 (2026-11-04)
        with:
          category: /release-gate:${{ matrix.language }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, browser-tests, source-barrier-browser-tests, mixed-version-browser-tests, vault-bridge-browser-tests, codeql-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
