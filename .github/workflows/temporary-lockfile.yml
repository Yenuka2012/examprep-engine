name: Temporary locked dependency update
on:
  push:
    branches: [feature/m0-exam-single-writer]
    paths: [.github/workflows/temporary-lockfile.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit reproducible dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "chore: lock Playwright E2E dependencies" && git push)
